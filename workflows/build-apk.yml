name: Build Android APK (Cloud)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch cs0x7f/min2phase Java solver
        run: |
          mkdir -p app/src/main/java/cs/min2phase
          BASE="https://raw.githubusercontent.com/cs0x7f/min2phase/master/src"
          for f in CoordCube.java CubieCube.java Search.java Tools.java Util.java; do
            curl -fsSL "$BASE/$f" -o "app/src/main/java/cs/min2phase/$f"
          done

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFOP-Speedcube-Lab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
