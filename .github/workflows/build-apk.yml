name: Build Android APK (Cloud)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch min2phase core solver
        run: |
          mkdir -p app/src/main/java/cs/min2phase
          rm -rf /tmp/min2phase
          git clone --depth 1 https://github.com/cs0x7f/min2phase.git /tmp/min2phase
          for f in CoordCube.java CubieCube.java Search.java Tools.java Util.java; do
            find /tmp/min2phase -name "$f" -exec cp {} app/src/main/java/cs/min2phase/ \;
          done
          ls -la app/src/main/java/cs/min2phase

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFOP-Speedcube-Lab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
