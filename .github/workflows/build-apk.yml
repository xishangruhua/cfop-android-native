name: Build Android APK (Cloud)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch min2phase source if missing
        run: |
          if [ ! -f "app/src/main/java/cs/min2phase/Search.java" ]; then
            git clone --depth 1 https://github.com/cs0x7f/min2phase.git /tmp/min2phase
            mkdir -p app/src/main/java/cs/min2phase
            cp /tmp/min2phase/*.java app/src/main/java/cs/min2phase/
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFOP-Speedcube-Lab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
